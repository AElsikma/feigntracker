<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Feign Tracker Pro</title>
  <style>
    /* DİNAMİK TEMA DEĞİŞKENLERİ */
    :root {
      --bg-color: #1e272e;
      --text-color: white;
      --panel-bg: #2d3436;
      --border-color: #353b48;
      --input-bg: #1e272e;
      --log-bg: #000000;
      --card-border: transparent;
      --heading-color: #ffd32a;
    }

    body.light-mode {
      --bg-color: #f5f6fa;
      --text-color: #2f3640;
      --panel-bg: #dcdde1;
      --border-color: #bdc3c7;
      --input-bg: #ffffff;
      --log-bg: #ffffff;
      --card-border: #7f8fa6;
      --heading-color: #e1b12c;
    }

    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; user-select: none; transition: background-color 0.3s, color 0.3s; }
    h3 { text-align: center; margin: 0 0 10px 0; color: var(--text-color); }
    
    /* SABİT BUTONLAR (SAĞ ÜST VE SAĞ ALT) */
    .fixed-top-right { position: absolute; top: 15px; right: 15px; display: flex; gap: 8px; z-index: 1000; }
    .fixed-top-right button { background: var(--panel-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .fixed-top-right button:hover { opacity: 0.8; }

    .fixed-bottom-right { position: fixed; bottom: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; align-items: flex-end; }
    #feedback-btn { background: #0fbcf9; color: #1e272e; border: none; padding: 12px 18px; border-radius: 25px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; }
    #feedback-btn:hover { transform: scale(1.05); }
    
    #feedback-panel { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; margin-bottom: 10px; width: 250px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: none; flex-direction: column; gap: 10px; }
    #feedback-panel textarea { width: 100%; height: 80px; resize: none; border-radius: 4px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); padding: 5px; box-sizing: border-box; font-family: inherit; }
    #feedback-panel button[type="submit"] { background: #0be881; color: black; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; }
#history-btn { background: #f39c12; color: #1e272e; border: none; padding: 12px 18px; border-radius: 25px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; margin-bottom: 10px; width: 100%; text-align: center; }
    #history-btn:hover { transform: scale(1.05); }
    
    #history-panel { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; margin-bottom: 10px; width: 320px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: none; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; }
    .history-record { border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 10px; font-size: 12px; }
    .history-date { font-weight: bold; color: var(--heading-color); margin-bottom: 5px; font-size: 14px; border-bottom: 1px dashed var(--border-color); padding-bottom: 3px;}
    .top-controls { display: flex; gap: 5px; margin-bottom: 10px; margin-top: 30px; }
    .top-controls button { flex: 1; padding: 8px; font-weight: bold; cursor: pointer; border: none; border-radius: 4px; }

    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .player-card { 
      min-height: 55px; height: auto; padding: 5px 0; border-radius: 8px; cursor: pointer; 
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      font-size: 11px; font-weight: bold; border: 2px solid var(--card-border); 
      transition: all 0.1s; position: relative; word-wrap: break-word; line-height: 1.2;
    }
    .player-card:active { transform: scale(0.95); }
    
    .roles-container { display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 4px; width: 100%; }
    .role-badge { background: rgba(0, 0, 0, 0.45); color: white; padding: 2px 4px; border-radius: 4px; font-size: 9px; font-weight: normal; text-shadow: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; }
    
    .white { background-color: #F3F3F3; color: black; border: 1px solid #ccc; }
    .orange { background-color: #FA8A1C; color: black; }
    .purple { background-color: #692985; color: white; }
    .dark-green { background-color: #2B7316; color: white; }
    .blue { background-color: #3E69DF; color: white; }
    .red { background-color: #B31116; color: white; }
    .yellow { background-color: #FCE14E; color: black; }
    .light-green { background-color: #7AFF48; color: black; }
    .cyan { background-color: #2BD8C8; color: black; }
    .light-pink { background-color: #FF95B7; color: black; }
    .brown { background-color: #5E3A21; color: white; }
    .magenta { background-color: #EB00E4; color: white; }
    .bright-orange { background-color: #F84000; color: white; }
    
    .status-icon { position: absolute; top: -5px; right: -5px; font-size: 14px; background: #2f3640; border-radius: 50%; width: 18px; height: 18px; display: none; align-items: center; justify-content: center; }

    .panel { margin-top: 10px; padding: 10px; background-color: var(--panel-bg); border-radius: 6px; display: none; text-align: center; border: 1px solid var(--border-color); }
    .action-btn { background-color: #485460; color: white; border: none; padding: 6px 10px; margin: 3px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
    .action-btn:hover { background-color: #808e9b; }
    .cancel-btn { background-color: #ff3f34; }
    .safe-btn { background-color: #0be881; color: black; }
    .sus-btn { background-color: #ff3f34; }
    .eylem-btn { background-color: #f39c12; color: black; }

    .role-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 8px; }
    .role-masum { background-color: #0be881; color: black; }
    .role-gri { background-color: #808e9b; color: white; }
    .role-hain { background-color: #ff3f34; color: white; }
    .role-tarafsiz { background-color: #4bcffa; color: black; }

    #bottom-section { display: flex; gap: 15px; margin-top: 15px; height: 45vh; min-height: 350px; }
    #log-container, #notes-container { flex: 1; display: flex; flex-direction: column; height: 100%; }
    #log-wrapper { flex: 1; background: var(--log-bg); padding: 10px; border-radius: 6px; overflow-y: auto; border: 1px solid var(--border-color); height: 0; }
    #log-list { list-style: none; padding: 0; margin: 0; font-size: 13px; user-select: text; -webkit-user-select: text; cursor: text; }
    #log-list li { padding: 4px 0; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .delete-log { background: none; border: none; color: #ff3f34; cursor: pointer; font-weight: bold; font-size: 12px; margin-left: 10px; }
    
    #notes-wrapper { flex: 1; background: var(--log-bg); padding: 10px; border-radius: 6px; display: flex; flex-direction: column; border: 1px solid var(--border-color); }
    #manual-notes { flex: 1; background: transparent; color: var(--text-color); border: none; resize: none; outline: none; font-family: inherit; font-size: 13px; line-height: 1.5; padding-top: 5px; height: 100%; }

    #decision-title { font-size: 24px !important; font-weight: 900 !important; color: var(--heading-color) !important; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7); margin-bottom: 12px !important; text-align: center; }
    body.light-mode #decision-title { text-shadow: none; }
    #decision-content { font-size: 16px !important; font-weight: 500 !important; color: var(--text-color) !important; margin-bottom: 22px !important; text-align: center; line-height: 1.5; }
    #decision-content b { color: var(--heading-color); font-size: 17px; }

    body { max-width: 1500px; margin: 0 auto; padding: 10px; }
       
    @media (max-width: 900px) {
      #bottom-section { flex-direction: column !important; height: auto !important; }
      #log-container, #notes-container { height: 250px !important; width: 100% !important; margin-bottom: 10px;}
      #decision-buttons > div { flex-direction: column !important; width: 100% !important; }
      #decision-buttons .action-btn { width: 100% !important; margin-top: 5px !important; }
      #decision-title { font-size: 20px !important; }
      #decision-content { font-size: 14px !important; margin-bottom: 15px !important; }
      .player-card { min-height: 45px; font-size: 10px; padding: 4px 0; }
    }
  </style>
  <meta name="description" content="Feign Tracker">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9436273957773353" crossorigin="anonymous"></script>
  <meta name="google-adsense-account" content="ca-pub-9436273957773353">
</head>
<body>

  <!-- SAĞ ÜST: TEMA VE DİL KONTROLLERİ -->
  <div class="fixed-top-right">
    <button id="theme-toggle" title="Gece/Gündüz Modu">☀️ Mode</button>
    <button id="lang-toggle" title="Dil Değiştir / Language">🌐 EN</button>
  </div>

  <div class="top-controls">
    <button id="btn-new-turn" style="background-color: #0fbcf9; color: black;" data-i18n="newTurn">Yeni Tura Geç</button>
    <button id="btn-reset-game" style="background-color: #ff3f34; color: white;" data-i18n="resetGame">Oyunu Sıfırla</button>
  </div>
  
  <div class="grid" id="player-grid">
    <div class="player-card white" id="Beyaz" data-color="White">Beyaz<span class="status-icon"></span></div>
    <div class="player-card orange" id="Turuncu" data-color="Orange">Turuncu<span class="status-icon"></span></div>
    <div class="player-card purple" id="Mor" data-color="Purple">Mor<span class="status-icon"></span></div>
    <div class="player-card dark-green" id="Koyu Yeşil" data-color="Dark Green">Koyu<br>Yeşil<span class="status-icon"></span></div>
    <div class="player-card blue" id="Mavi" data-color="Blue">Mavi<span class="status-icon"></span></div>
    
    <div class="player-card red" id="Kırmızı" data-color="Red">Kırmızı<span class="status-icon"></span></div>
    <div class="player-card yellow" id="Sarı" data-color="Yellow">Sarı<span class="status-icon"></span></div>
    <div class="player-card light-green" id="Açık Yeşil" data-color="Light Green">Açık<br>Yeşil<span class="status-icon"></span></div>
    <div class="player-card cyan" id="Turkuaz" data-color="Cyan">Turkuaz<span class="status-icon"></span></div>
    <div class="player-card light-pink" id="Açık Pembe" data-color="Light Pink">Açık<br>Pembe<span class="status-icon"></span></div>
    
    <div class="player-card brown" id="Kahverengi" data-color="Brown">Kahve<span class="status-icon"></span></div>
    <div class="player-card magenta" id="Koyu Pembe" data-color="Magenta">Koyu<br>Pembe<span class="status-icon"></span></div>
    <div class="player-card bright-orange" id="Parlak Turuncu" data-color="Bright Orange">Parlak<br>Turuncu<span class="status-icon"></span></div>
  </div>

  <div class="panel" id="action-panel">
    <strong id="selected-name" style="display:block; margin-bottom: 8px; font-size: 14px;"></strong>
    <div>
      <button class="action-btn safe-btn" onclick="markPlayer('safe')" data-i18n="safe">✔ Güvenli</button>
      <button class="action-btn sus-btn" onclick="markPlayer('sus')" data-i18n="sus">✘ Şüpheli</button>
    </div>
    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 8px 0;">
    <button class="action-btn" onclick="openPanel('role-panel')" data-i18n="setRole">Rol Belirt</button>
    <button class="action-btn" id="btn-went" data-i18n="wentTo">Şuraya Gitti ➔</button>
    <button class="action-btn eylem-btn" onclick="openPanel('eylem-panel')" data-i18n="actionSpecial">⚡ Eylem (Rol Özel)</button>
    <button class="action-btn eylem-btn" style="background-color: #9b59b6; color: white;" onclick="openPanel('gelen-eylem-panel')" data-i18n="incomingActions">📥 Gelen Eylemler</button>
    <button class="action-btn" id="btn-stayed" data-i18n="stayedHome">Evde Kaldı</button>
    <button class="action-btn" id="btn-went-out" data-i18n="wentOut">Dışarı Çıktı (Belirsiz)</button>
    <br>
    <button class="action-btn cancel-btn" onclick="resetSelection()" data-i18n="cancel">İptal</button>
  </div>

  <div class="panel" id="role-panel">
    <strong style="display:block; margin-bottom: 8px; font-size: 13px;" data-i18n="chooseRole">Rol Seçin</strong>
    <div class="role-grid" id="role-grid-container">
      <!-- Roles injected via JS based on language -->
    </div>
    <button class="action-btn cancel-btn" style="width: 100%; margin-top: 5px;" onclick="openPanel('action-panel')" data-i18n="back">Geri</button>
  </div>

  <div class="panel" id="eylem-panel">
    <strong style="display:block; margin-bottom: 8px; font-size: 13px;" data-i18n="whoseAction">Hangi Rolün Eylemi?</strong>
    <div class="role-grid" id="action-grid-container">
       <!-- Action buttons injected via JS -->
    </div>
    <button class="action-btn cancel-btn" style="width: 100%;" onclick="openPanel('action-panel')" data-i18n="back">Geri</button>
  </div>

  <div class="panel" id="decision-panel">
    <strong id="decision-title" style="display:block; margin-bottom: 8px; font-size: 13px; color: var(--heading-color);">...</strong>
    <div id="decision-content" style="margin-bottom: 10px; font-size: 11px;"></div>
    <div id="decision-buttons"></div>
    <br>
    <button class="action-btn cancel-btn" style="width: 100%;" onclick="resetSelection()" data-i18n="cancelSelection">İptali Seç</button>
  </div>

  <div class="panel" id="gelen-eylem-panel">
    <strong style="display:block; margin-bottom: 8px; font-size: 13px;" data-i18n="whatHappened">Bu Oyuncuya Ne Yapıldı?</strong>
    <div class="role-grid" id="incoming-action-container">
      <!-- Incoming actions injected via JS -->
    </div>
    <button class="action-btn cancel-btn" style="width: 100%; margin-top: 5px;" onclick="openPanel('action-panel')" data-i18n="back">Geri</button>
  </div>

  <div id="bottom-section">
    <div id="log-container">
      <div id="log-header-controls" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid var(--border-color);">
        <h3 style="margin: 0; color: var(--heading-color); font-size: 16px;" data-i18n="actionHistory">Aksiyon Geçmişi</h3>
        <input type="text" id="log-search" placeholder="Geçmişte ara..." style="padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-color); outline: none; width: 140px; font-size: 13px;">
      </div>
      <div id="log-wrapper">
         <ul id="log-list"></ul>
      </div>
    </div>
    
    <div id="notes-container">
      <div style="font-weight: bold; margin-bottom: 5px; color: #808e9b; font-size: 12px;" data-i18n="freeNotes">Serbest Notlar</div>
      <div id="notes-wrapper">
         <textarea id="manual-notes" placeholder="Şüphelerinizi buraya yazabilirsiniz..."></textarea>
      </div>
    </div>
  </div>

  <!-- SAĞ ALT: GEÇMİŞ VE GERİ BİLDİRİM FORMU -->
  <div class="fixed-bottom-right">
    
    <!-- OYUN GEÇMİŞİ PANELİ -->
    <div id="history-panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <strong style="color: var(--text-color); font-size: 15px;" data-i18n="pastGames">Geçmiş Oyunlar</strong>
        <button id="clear-history-btn" data-i18n="clearHistory" style="background: #ff3f34; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold;">Temizle</button>
      </div>
      <div id="history-list-container">
        <!-- JS ile geçmiş buraya eklenecek -->
      </div>
    </div>
    <button id="history-btn" data-i18n="historyBtn">📜 Oyun Geçmişi</button>

    <!-- GERİ BİLDİRİM PANELİ -->
    <div id="feedback-panel">
      <strong style="color: var(--text-color); font-size: 14px;" data-i18n="feedbackTitle">Bize Ulaşın</strong>
      <form action="mailto:abdulkadir.elsikma@gmail.com" method="post" enctype="text/plain">
        <textarea name="Mesaj" placeholder="Görüş, öneri veya hata bildirimi..." required></textarea>
        <button type="submit" style="width:100%;" data-i18n="send">Gönder</button>
      </form>
    </div>
    <button id="feedback-btn" data-i18n="feedbackBtn">💬 Geri Bildirim</button>
  </div>

  <script src="./renderer.js"></script>

  <footer style="text-align: center; padding: 30px; margin-top: 50px; border-top: 1px solid var(--border-color);">
    <p style="color: #57606f; font-size: 12px; margin-top: 10px;">&copy; 2026 feigntracker.com - Bağımsız Oyuncu Aracı</p>
  </footer>

</body>
</html>
